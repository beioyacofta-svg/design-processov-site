# Приём заявок с сайта design-processov.ru → Telegram
# Запуск:  docker compose up -d --build
# Логи:    docker compose logs -f
# Стоп:    docker compose down

services:
  leads-api:
    build: .
    image: leads-api:1.0
    container_name: leads-api
    restart: unless-stopped            # переживает перезагрузку сервера
    env_file: .env                     # настройки контейнера (порт, журналы)
    environment:
      ENV_FILE: /run/secrets/leads.env  # токен и адрес доставки читаются из этого файла
    ports:
      - "127.0.0.1:8099:8099"          # наружу не торчит: запросы идут через Caddy
    volumes:
      - ./logs:/app/logs               # журналы остаются на хосте
      - ./secrets/leads.env:/run/secrets/leads.env:ro  # секреты: только чтение, в образ не попадают
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    sysctls:
      # у контейнера нет IPv6-маршрута, а Telegram резолвится и в IPv6:
      # без этого доставка падает с «Network is unreachable»
      net.ipv6.conf.all.disable_ipv6: "1"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
