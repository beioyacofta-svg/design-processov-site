<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страница не найдена — Дизайн процессов</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#142a22;--ink-soft:#4f6d61;--accent:#0a7a5c}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
  font-family:'Karla',-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,#f2fbf7,#e7f5ee);line-height:1.6}
.card{max-width:520px;text-align:center;background:rgba(255,255,255,.8);border-radius:22px;
  padding:40px 30px;box-shadow:0 18px 44px rgba(20,60,48,.10)}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 10px}
p{color:var(--ink-soft);margin:0 0 22px}
a{display:inline-block;padding:12px 20px;border-radius:12px;background:var(--ink);color:#f7fff9;
  text-decoration:none;font-weight:600;margin:4px}
a.ghost{background:transparent;color:var(--accent);border:1px solid rgba(10,122,92,.35)}
</style>
</head>
<body>
  <div class="card">
    <h1>Такой страницы нет</h1>
    <p>Возможно, адрес изменился или в ссылке опечатка. Начните с главной — там всё, что нужно.</p>
    <a href="/">На главную</a>
    <a class="ghost" href="/kompas/">Пройти диагностику</a>
  </div>
</body>
</html>
